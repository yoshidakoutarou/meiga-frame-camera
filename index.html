<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="名画カメラ">
<meta name="theme-color" content="#141210">
<title>名画フレームカメラ</title>
<style>
/*
VOICE: 撮影現場の道具。静かで、手元の操作に迷わない
IDEA: 美術館の額縁越しにのぞくカメラ
PICTURE: 9:16のステージ（絵＋穴の中のカメラ映像）が画面の主役
COLOUR/TYPE: 深い壁色の地、金の額縁色をアクセント
LAYOUT: 上にステージ、下に親指で届く操作列
*/
:root{--bg:#141210;--panel:#1f1c19;--line:#3a342d;--ink:#f3eee6;--sub:#a89f92;--gold:#c9a45c;--rec:#e5483b;--err:#4a1d18}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stageWrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;min-height:0}
#stage{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;background:#000;border-radius:10px;overflow:hidden;touch-action:none}
#mirror{position:absolute;inset:0}
#mirror.flip{transform:scaleX(-1)}
#view{position:absolute;inset:0;width:100%;height:100%}
#hole{position:absolute;outline:2px dashed var(--gold);display:none;touch-action:none;cursor:move}
#hole.on{display:block}
#hole .h{position:absolute;right:-22px;bottom:-22px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:nwse-resize}
#hole .h::after{content:"";width:26px;height:26px;border-radius:50%;background:var(--gold);border:3px solid var(--bg)}
#hint{position:absolute;left:0;right:0;top:40%;text-align:center;padding:0 24px;color:var(--sub);pointer-events:none}
#recBadge{position:absolute;top:10px;left:10px;background:var(--rec);color:#fff;font-weight:700;padding:3px 10px;border-radius:99px;display:none;font-variant-numeric:tabular-nums}
#msg{position:absolute;left:10px;right:10px;bottom:10px;background:var(--err);border:1px solid var(--rec);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:13px;display:none}
#msg.on{display:block}
.bar{display:flex;gap:6px;padding:4px 10px;flex-wrap:wrap;justify-content:center;align-items:center}
button,.file{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,.file:focus-within{outline:2px solid var(--gold);outline-offset:2px}
button.on{border-color:var(--gold);color:var(--gold)}
button:disabled{opacity:.4}
.file input{display:none}
#recBtn{width:72px;height:72px;border-radius:50%;padding:0;background:transparent;border:4px solid var(--ink)}
#recBtn i{width:52px;height:52px;border-radius:50%;background:var(--rec);transition:all .2s}
#recBtn.rec i{width:28px;height:28px;border-radius:6px}
.zoom{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px;width:100%;max-width:420px}
.zoom input{flex:1;accent-color:var(--gold);height:44px}
#info{color:var(--sub);font-size:11px;text-align:center;padding:0 10px;font-variant-numeric:tabular-nums}
#result{position:fixed;inset:0;background:rgba(10,9,8,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
#result.on{display:flex}
#result video{max-height:62vh;max-width:100%;border-radius:10px;background:#000}
#result p{margin:0;color:var(--sub);font-size:13px;text-align:center;max-width:360px}
#saveBtn{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700}
@media (prefers-reduced-motion:reduce){#recBtn i{transition:none}}
</style>
</head>
<body>
<div id="stageWrap">
  <div id="stage">
    <div id="mirror">
      <canvas id="view" width="1080" height="1920"></canvas>
      <div id="hole"><div class="h"></div></div>
    </div>
    <div id="hint">① 名画を選ぶ<br>② カメラを起動<br>③ 穴の位置を合わせて録画</div>
    <div id="recBadge">● 0:00</div>
    <div id="msg" role="alert"></div>
  </div>
</div>

<div class="bar">
  <label class="file">名画を選ぶ<input id="pic" type="file" accept="image/*"></label>
  <button id="fitBtn">全体表示</button>
  <button id="editBtn">穴を編集</button>
  <button id="sqBtn" class="on">正方形</button>
</div>
<div class="bar">
  <button id="camBtn">カメラを起動</button>
  <button id="flipBtn" disabled>前/後</button>
  <button id="mirBtn" class="on">鏡写し</button>
  <button id="modeBtn">引き</button>
</div>
<div class="bar">
  <label class="zoom">カメラの大きさ<input id="zoom" type="range" min="1" max="3" step="0.05" value="1"></label>
</div>
<div class="bar"><button id="recBtn" disabled aria-label="録画"><i></i></button></div>
<div id="info"></div>

<div id="result">
  <video id="out" controls playsinline></video>
  <div class="bar">
    <button id="saveBtn">保存する</button>
    <a id="dl" class="file" download="meiga.mp4">ファイルに保存</a>
    <button id="closeBtn">撮り直す</button>
  </div>
  <p>「保存する」で共有メニューが開きます。「ビデオを保存」を選ぶと写真アプリに入ります。</p>
</div>

<script>
{
const W=1080,H=1920,MAX_REC=60,MAX_SIDE=4096,MAX_AREA=16e6;
const $=id=>document.getElementById(id);
const view=$('view'),ctx=view.getContext('2d');
const stage=$('stage'),mirrorEl=$('mirror'),holeEl=$('hole');
const layer=document.createElement('canvas');layer.width=W;layer.height=H;const lctx=layer.getContext('2d');

// iPhoneでは画面に置いていないvideoが止まることがあるので、見えない形でDOMに置く
const video=document.createElement('video');
video.muted=true;video.playsInline=true;video.setAttribute('playsinline','');video.setAttribute('muted','');
Object.assign(video.style,{position:'fixed',left:'0',top:'0',width:'2px',height:'2px',opacity:'0',pointerEvents:'none'});
document.body.appendChild(video);

// ---- 状態 ----
// hole は「絵の画像に対する比率」（0〜1）
let pic=null;            // {src, w, h}
let stream=null,facing='user';
const st={hole:{x:.3,y:.6,w:.4,h:.4},fit:'contain',zoom:1,mirror:true,square:true};
let mode='wide',editing=false;
try{const s=JSON.parse(localStorage.getItem('meiga.v2')||'null');if(s&&s.hole&&s.hole.w)Object.assign(st,s);}catch(e){}
function saveState(){try{localStorage.setItem('meiga.v2',JSON.stringify(st))}catch(e){}}

// ---- エラー表示 ----
let msgTimer=null;
function showMsg(t,keep){const m=$('msg');m.textContent=t;m.classList.add('on');clearTimeout(msgTimer);if(!keep)msgTimer=setTimeout(()=>m.classList.remove('on'),8000);}
$('msg').onclick=()=>$('msg').classList.remove('on');
window.addEventListener('error',e=>showMsg('エラーが起きました：'+(e.message||'不明なエラー')));
window.addEventListener('unhandledrejection',e=>showMsg('エラーが起きました：'+((e.reason&&e.reason.message)||e.reason||'不明なエラー')));

// ---- 配置の計算 ----
// 絵を画面（1080×1920）のどこにどの倍率で描くか、穴が画面のどこに来るかを返す
function layoutWide(){
  const s=st.fit==='contain'?Math.min(W/pic.w,H/pic.h):Math.max(W/pic.w,H/pic.h);
  return {s,ox:(W-pic.w*s)/2,oy:(H-pic.h*s)/2};
}
function layout(){
  if(!pic)return null;
  let {s,ox,oy}=layoutWide();
  const h=st.hole;
  if(mode==='close'){
    // 寄り：穴の中心で絵を拡大し、穴を画面幅いっぱい（収まらなければ画面の高さいっぱい）にする
    const k=Math.min(W/(h.w*pic.w*s),H/(h.h*pic.h*s));
    s*=k;
    ox=W/2-(h.x+h.w/2)*pic.w*s;oy=H/2-(h.y+h.h/2)*pic.h*s;
  }
  return {s,ox,oy,hx:ox+h.x*pic.w*s,hy:oy+h.y*pic.h*s,hw:h.w*pic.w*s,hh:h.h*pic.h*s};
}
// 穴を「絵の中」かつ「画面の中」に収める
function clampHole(){
  if(!pic)return;
  const {s,ox,oy}=layoutWide(),h=st.hole;
  const x0=Math.max(0,-ox/(s*pic.w)),x1=Math.min(1,(W-ox)/(s*pic.w));
  const y0=Math.max(0,-oy/(s*pic.h)),y1=Math.min(1,(H-oy)/(s*pic.h));
  const minW=.05;
  if(st.square){
    const r=pic.w/pic.h;                    // 正方形：h = w × 幅/高さ
    h.w=Math.max(minW,Math.min(h.w,x1-x0,(y1-y0)/r));h.h=h.w*r;
  }else{
    h.w=Math.max(minW,Math.min(h.w,x1-x0));h.h=Math.max(minW,Math.min(h.h,y1-y0));
  }
  h.x=Math.min(Math.max(h.x,x0),x1-h.w);h.y=Math.min(Math.max(h.y,y0),y1-h.h);
}

// ---- 描画 ----
function buildLayer(){
  lctx.clearRect(0,0,W,H);
  const L=layout();
  if(L){
    lctx.fillStyle='#2a2622';lctx.fillRect(0,0,W,H);
    lctx.imageSmoothingQuality='high';
    lctx.drawImage(pic.src,L.ox,L.oy,pic.w*L.s,pic.h*L.s);
    lctx.save();lctx.globalCompositeOperation='destination-out';
    lctx.fillRect(L.hx,L.hy,L.hw,L.hh);
    lctx.restore();
    Object.assign(holeEl.style,{left:L.hx/W*100+'%',top:L.hy/H*100+'%',width:L.hw/W*100+'%',height:L.hh/H*100+'%'});
  }
  updateInfo();
}
function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(video.readyState>=2&&video.videoWidth){
    const vw=video.videoWidth,vh=video.videoHeight;
    const s0=Math.max(W/vw,H/vh);
    const bx=(W-vw*s0)/2,by=(H-vh*s0)/2;
    const z=mode==='close'?1:st.zoom;       // 寄りではカメラは等倍
    const L=layout();
    // 拡大の中心は穴の中心（絵がないときは画面の中心）
    const cx=L?L.hx+L.hw/2:W/2,cy=L?L.hy+L.hh/2:H/2;
    ctx.drawImage(video,cx-(cx-bx)*z,cy-(cy-by)*z,vw*s0*z,vh*s0*z);
  }
  ctx.drawImage(layer,0,0);
  requestAnimationFrame(draw);
}
function flipped(){return st.mirror&&facing==='user';}
function applyMirror(){mirrorEl.classList.toggle('flip',flipped());$('mirBtn').classList.toggle('on',st.mirror);}

// ---- 絵を選ぶ ----
$('pic').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f);
  const i=new Image();
  i.onload=()=>{
    let w=i.naturalWidth,h=i.naturalHeight,src=i;
    // 大きすぎる画像はiPhoneで描けないことがあるので縮める
    const k=Math.min(1,MAX_SIDE/Math.max(w,h),Math.sqrt(MAX_AREA/(w*h)));
    if(k<1){
      const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
      const cx=c.getContext('2d');cx.imageSmoothingQuality='high';cx.drawImage(i,0,0,c.width,c.height);
      src=c;w=c.width;h=c.height;URL.revokeObjectURL(url);
    }
    pic={src,w,h,ow:i.naturalWidth,oh:i.naturalHeight};
    clampHole();buildLayer();updateHint();
  };
  i.onerror=()=>{URL.revokeObjectURL(url);showMsg('画像を読み込めませんでした。別の画像を選んでください。');};
  i.src=url;e.target.value='';
};
function updateHint(){
  const t=[];if(!pic)t.push('① 名画を選ぶ');if(!stream)t.push('② カメラを起動');
  if(t.length){t.push('③ 穴の位置を合わせて録画');$('hint').innerHTML=t.join('<br>');$('hint').style.display='block';}
  else $('hint').style.display='none';
}

// ---- カメラ ----
async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showMsg('このブラウザではカメラを使えません。httpsのページをSafariで開いてください。',true);return;}
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}}});
  }catch(err){
    const why=err.name==='NotAllowedError'?'カメラの使用が許可されていません。設定アプリ →「Safari」→「カメラ」で許可してください。'
      :err.name==='NotFoundError'||err.name==='OverconstrainedError'?'使えるカメラが見つかりませんでした。'
      :'カメラを起動できませんでした。';
    showMsg(why+'（'+err.name+'）',true);updateHint();return;
  }
  video.srcObject=stream;
  try{await video.play();}catch(e){}
  $('msg').classList.remove('on');
  $('flipBtn').disabled=false;$('recBtn').disabled=false;$('camBtn').textContent='カメラ再起動';
  applyMirror();updateHint();keepAwake();
  video.onloadedmetadata=updateInfo;updateInfo();
}
$('camBtn').onclick=startCam;
$('flipBtn').onclick=()=>{facing=facing==='user'?'environment':'user';startCam();};
$('mirBtn').onclick=()=>{st.mirror=!st.mirror;applyMirror();saveState();};

// ---- 表示の切替 ----
$('fitBtn').onclick=()=>{st.fit=st.fit==='contain'?'cover':'contain';clampHole();buildLayer();syncButtons();saveState();};
$('modeBtn').onclick=()=>{mode=mode==='wide'?'close':'wide';if(mode==='close'&&editing)toggleEdit();buildLayer();syncButtons();};
$('zoom').oninput=e=>{st.zoom=+e.target.value;};
$('zoom').onchange=saveState;
$('sqBtn').onclick=()=>{st.square=!st.square;clampHole();buildLayer();syncButtons();saveState();};
function toggleEdit(){editing=!editing;holeEl.classList.toggle('on',editing);syncButtons();}
$('editBtn').onclick=()=>{if(!pic){showMsg('先に名画を選んでください。');return;}toggleEdit();};
function syncButtons(){
  $('fitBtn').textContent=st.fit==='contain'?'全体表示':'画面いっぱい';
  $('modeBtn').textContent=mode==='wide'?'引き':'寄り';$('modeBtn').classList.toggle('on',mode==='close');
  $('editBtn').textContent=editing?'編集を終える':'穴を編集';$('editBtn').classList.toggle('on',editing);
  $('editBtn').disabled=mode==='close';
  $('sqBtn').classList.toggle('on',st.square);
  $('zoom').disabled=mode==='close';$('zoom').value=mode==='close'?1:st.zoom;
}

// ---- 穴のドラッグ（移動）とハンドル（大きさ）----
let drag=null;
holeEl.addEventListener('pointerdown',e=>{
  if(!editing||!pic)return;
  drag={size:!!e.target.closest('.h'),sx:e.clientX,sy:e.clientY,h0:{...st.hole}};
  holeEl.setPointerCapture(e.pointerId);e.preventDefault();
});
holeEl.addEventListener('pointermove',e=>{
  if(!drag)return;
  const r=stage.getBoundingClientRect(),{s}=layoutWide();
  // 画面上の指の動き → 1080×1920の座標 → 絵の比率。鏡写し表示中は左右を戻す
  const dx=(e.clientX-drag.sx)*(W/r.width)*(flipped()?-1:1)/(s*pic.w);
  const dy=(e.clientY-drag.sy)*(H/r.height)/(s*pic.h);
  const h=st.hole,h0=drag.h0;
  if(!drag.size){h.x=h0.x+dx;h.y=h0.y+dy;}
  else{h.x=h0.x;h.y=h0.y;h.w=h0.w+dx;h.h=st.square?h.w*pic.w/pic.h:h0.h+dy;}
  clampHole();buildLayer();
});
const endDrag=()=>{if(drag){drag=null;saveState();}};
holeEl.addEventListener('pointerup',endDrag);holeEl.addEventListener('pointercancel',endDrag);

// ---- 録画 ----
let rec=null,chunks=[],t0=0,timer=null,mime='',outFile=null,outUrl=null;
function pickMime(){
  for(const m of['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'])
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;
  return '';
}
function startRec(){
  if(!window.MediaRecorder||!view.captureStream){showMsg('このブラウザは録画に対応していません。');return;}
  mime=pickMime();
  try{
    const s=view.captureStream(30);
    rec=new MediaRecorder(s,mime?{mimeType:mime,videoBitsPerSecond:10e6}:{videoBitsPerSecond:10e6});
  }catch(err){showMsg('録画を開始できませんでした（'+err.name+'）');rec=null;return;}
  chunks=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  rec.onstop=showResult;
  rec.onerror=e=>showMsg('録画中にエラーが起きました：'+((e.error&&e.error.name)||''));
  rec.start();
  if(editing)toggleEdit();
  $('recBtn').classList.add('rec');$('recBadge').style.display='block';t0=performance.now();
  timer=setInterval(()=>{
    const s=Math.floor((performance.now()-t0)/1000);
    $('recBadge').textContent='● '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    if(s>=MAX_REC)stopRec();
  },250);
}
function stopRec(){if(rec&&rec.state==='recording')rec.stop();}
$('recBtn').onclick=()=>{if(rec&&rec.state==='recording')stopRec();else startRec();};
function showResult(){
  clearInterval(timer);$('recBtn').classList.remove('rec');$('recBadge').style.display='none';
  const type=(rec&&rec.mimeType||mime||'video/webm').split(';')[0];
  const blob=new Blob(chunks,{type});chunks=[];
  if(!blob.size){showMsg('録画データが空でした。もう一度撮ってください。');return;}
  const ext=type.includes('mp4')?'mp4':'webm';
  const name='meiga-'+new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')+'.'+ext;
  // 共有メニューはタップ直後に呼ぶ必要があるため、ファイルはここで作っておく
  outFile=new File([blob],name,{type});
  if(outUrl)URL.revokeObjectURL(outUrl);
  outUrl=URL.createObjectURL(blob);
  $('out').src=outUrl;$('dl').href=outUrl;$('dl').download=name;
  $('result').classList.add('on');
}
$('saveBtn').onclick=()=>{
  if(!outFile)return;
  if(navigator.canShare&&navigator.canShare({files:[outFile]})){
    navigator.share({files:[outFile]}).catch(err=>{if(err.name!=='AbortError')showMsg('共有メニューを開けませんでした（'+err.name+'）。「ファイルに保存」を使ってください。');});
  }else $('dl').click();
};
$('closeBtn').onclick=()=>{$('result').classList.remove('on');$('out').pause();$('out').removeAttribute('src');$('out').load();};

// ---- 画面の点灯と、裏に回ったときの扱い ----
let wakeLock=null;
async function keepAwake(){
  try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopRec();return;}
  if(stream){
    const live=stream.getVideoTracks().some(t=>t.readyState==='live');
    if(!live)startCam();else video.play().catch(()=>{});
    keepAwake();
  }
});

function updateInfo(){
  const t=[];
  if(video.videoWidth)t.push('カメラ '+video.videoWidth+'×'+video.videoHeight);
  if(pic){
    t.push('絵 '+pic.ow+'×'+pic.oh+(pic.ow!==pic.w?'（'+pic.w+'×'+pic.h+'に縮小）':''));
    if(mode==='close'){const L=layout();if(L&&L.s>1.001)t.push('絵の拡大 '+L.s.toFixed(1)+'倍');}
  }
  const m=pickMime();t.push('録画 '+(m?m.split(';')[0]:'非対応'));
  $('info').textContent=t.join(' ／ ');
}

applyMirror();syncButtons();buildLayer();requestAnimationFrame(draw);
}
</script>
</body>
</html>
